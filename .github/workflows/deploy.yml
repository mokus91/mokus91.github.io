name: Deploy Global Support Radar to root GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gsr-root-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source website
        uses: actions/checkout@v4
        with:
          repository: mokus91/global-support-radar
          ref: main
          path: source

      - name: Prepare root-domain website
        shell: bash
        run: |
          mkdir public
          rsync -a --exclude='.git' --exclude='.github' source/ public/
          python3 - <<'PY'
          from pathlib import Path
          root = Path("public")
          replacements = [
              ("https://mokus91.github.io/global-support-radar/", "https://mokus91.github.io/"),
              ("http://mokus91.github.io/global-support-radar/", "https://mokus91.github.io/"),
              ("/global-support-radar/", "/"),
          ]
          text_suffixes = {".html", ".htm", ".js", ".css", ".json", ".xml", ".txt", ".webmanifest", ".md", ".yml", ".yaml"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = content
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated, encoding="utf-8")
          PY
          test -f public/index.html
          test -f public/ads.txt
          grep -q 'ca-pub-7022315203746196' public/index.html
          grep -q 'pub-7022315203746196' public/ads.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
